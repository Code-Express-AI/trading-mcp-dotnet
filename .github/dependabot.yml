# Dependabot opens a pull request when a package has an update, and CI tests it before we merge.
# Security fixes don't wait for the schedule: Dependabot security updates open them straight away.
version: 2

updates:
  - package-ecosystem: nuget
    directories:
      - /DataGenerator
      - /McpServer
      - /XTests
    schedule:
      interval: monthly
    # Stay on the .NET 10 packages. Moving to .NET 11 is a deliberate upgrade, done with the TargetFramework.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
